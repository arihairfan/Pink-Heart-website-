<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Animation</title>
    <style>
        body {
            margin: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background-color: black;
        }
    </style>
</head>
<body>

    <canvas id="heart-canvas" width="600" height="600"></canvas>

    <script>
        const canvas = document.getElementById("heart-canvas");
        const ctx = canvas.getContext("2d");

        ctx.translate(canvas.width / 2, canvas.height / 2);

        const colors = ["red", "blue", "lime", "yellow", "cyan", "magenta", "orange", "pink"];
        let i = 0;

        function drawHeart() {
            if (i >= 120) return;

            let angle = i * (Math.PI * 2) / 120;
            let x = 16 * Math.pow(Math.sin(angle), 3) * 15;
            let y = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle)) * 15;

            let c = colors[Math.floor(Math.random() * colors.length)];
            ctx.strokeStyle = c;
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(0, -40);
            ctx.lineTo(x, y);
            ctx.stroke();

            i++;
            setTimeout(drawHeart, 50);
        }

        drawHeart();
    </script>

</body>
</html>
