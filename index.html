<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Animation</title>
    <!-- Load Brython to run Python in the browser -->
    <script src="https://cdn.jsdelivr.net/npm/brython@3.10.6/brython.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/brython@3.10.6/brython_stdlib.js"></script>
    <style>
        body {
            margin: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background-color: black;
        }
    </style>
</head>
<body onload="brython()">

    <canvas id="turtle-canvas" width="800" height="800"></canvas>

    <script type="text/python">
        import browser
        import turtle
        import math
        import random

        turtle.set_canvas(browser.document["turtle-canvas"])

        screen = turtle.Screen()
        screen.bgcolor('black')

        t = turtle.Turtle()
        t.speed(0)
        t.hideturtle()
        t.pensize(1)

        colors = ["red", "blue", "lime", "yellow", "cyan", "magenta", "orange", "pink"]

        for i in range(120):
            t.penup()
            t.goto(0, 40)
            angle = i * (math.pi * 2) / 120
            x = 16 * (math.sin(angle) ** 3) * 15
            y = (13 * math.cos(angle) - 5 * math.cos(2 * angle) - 2 * math.cos(3 * angle) - math.cos(4 * angle)) * 15
            c = random.choice(colors)
            t.color(c)
            t.pendown()
            t.goto(x, y)
            for _ in range(8):
                t.forward(6)
                t.backward(6)
                t.right(45)

        turtle.done()
    </script>

</body>
</html>
